# yaml-language-server: $schema=https://raw.githubusercontent.com/itslab42/agentctl/main/schemas/config.schema.json
project:
  name: __PROJECT_NAME__

# Optionally inherit a shared base policy. Local permissions can only tighten it.
# extends: "https://raw.githubusercontent.com/myorg/policies/main/.ai/permissions.yaml"
# extends: "@myorg/agent-policy/permissions.yaml"
# extends: "../shared/.ai/permissions.yaml"

runtimes:
  claude:
    enabled: true
  codex:
    enabled: false
  cursor:
    enabled: false
  kiro:
    enabled: false
  opencode:
    enabled: false

sync:
  permissions: true
  instructions: true
  # mcp: true

files:
  permissions: .ai/permissions.yaml
  instructions: .ai/instructions.md
  # mcp: .ai/mcp.yaml
